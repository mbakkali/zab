# Minimal zab configuration example.
# Copy to ~/.config/zab/config.yaml and adjust paths for your machine.

skills_roots:
  - ~/skills

projects_roots:
  - ~/projects

organizations:
  - work
  - personal
  - clients

logging:
  default_actor: mehdi

cli_watchlist:
  - gh

tracked_env_extra: []

# Secret provider used by the Security tab and by `zab secrets`.
#
# Declare the project explicitly. Without it zab falls back to whatever
# `gcloud config get-value project` returns, which is rarely the project that
# actually holds your secrets — and Secret Manager may not even be enabled
# there, so every call fails with a message about the wrong project.
#
# `prefix` names the secrets zab creates: QONTO_API_KEY -> zab-qonto-api-key.
# Set it to "" to create them unprefixed. An existing secret can always be
# referenced by hand, whatever its name: the reference in the .env is explicit.
# `map` is only needed for secrets that already exist under another name:
# without it the id is derived (QONTO_API_KEY -> zab-qonto-api-key), which
# would not find a secret someone created as `qonto-prod-key`.
#
# ~/.config/zab/.env is the source of truth and stays plaintext; Secret Manager
# is a mirror. Nothing is ever removed from a .env.
# secret_manager:
#   project: my-gcp-project
#   prefix: zab-
#   map:
#     QONTO_API_KEY: qonto-prod-key
#   # Which project .env names `mirror --projects` keeps. Defaults to a
#   # broad set of secret-ish words; it reads the name, not the value.
#   sensitive_name_pattern: (KEY|TOKEN|SECRET|PASSWORD|DSN|AUTH)

# Optional: Postgres memory / conversations archive
# Set ZAB_MEMORY_DATABASE_URL in ~/.config/zab/.env or your skills/.env

# Optional: Obsidian vault used by daily digests and quick-capture tools
# obsidian:
#   vault_path: ~/ObsidianVault
#   inbox_dir: 00_inbox
#   daily_dir: 10_daily
#   daily_template: 90_meta/templates/daily.md

# Optional: remote dev workstation (GCP)
# workstation:
#   project_id: your-gcp-project
#   instance_name: your-workstation
#   region: europe-west9
#   zone: europe-west9-b
#   bucket: gs://your-sync-bucket
#   firewall_rule: allow-your-ip
#   gcloud_config: default

# Optional: remote dev VM monitoring (cost, runtime hours, SSH, file sync)
# remote_vm:
#   project: your-gcp-project
#   zone: europe-west9-b
#   instance: your-dev-vm
#   gcloud_config: default              # gcloud configuration used for compute reads
#   ssh_alias: your-dev-vm-iap          # ~/.ssh/config alias used by the file synchronizer
#   vmctl: ~/path/to/vmctl.sh           # optional start/stop script that also drives the sync
#   deploy_config: ~/path/to/config.json  # optional descriptor pre-filling the keys above
#   billing:
#     gcloud_config: your-billing-reader-config
#     project: your-gcp-project
#     table: your-project.your_dataset.gcp_billing_export_resource_v1_XXXXXX
#     currency: EUR
#     resource_match: ["%your-dev-vm%"]   # optional, derived from the instance name otherwise

