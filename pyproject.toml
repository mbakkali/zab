[project]
name = "zab"
version = "0.2.0"
description = "Local-first CLI and dashboard for AI workspace orchestration — skills, MCP, projects, and agent context."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "zab contributors" }]
keywords = ["cli", "mcp", "skills", "agents", "local-first", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "google-auth[requests]>=2.35.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mbakkali/zab"
Documentation = "https://github.com/mbakkali/zab#readme"
Repository = "https://github.com/mbakkali/zab"
Issues = "https://github.com/mbakkali/zab/issues"

[project.scripts]
zab = "zab.cli:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zab"]

[tool.hatch.build.targets.sdist]
include = ["zab/**", "README.md", "pyproject.toml", "LICENSE"]

[project.optional-dependencies]
memory = [
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["zab/tests"]
pythonpath = ["."]
