# Copy to ~/.config/zab/local-tools.yaml (recommended) or zab/local-tools.yaml in your clone.
#
# cli_watchlist: binaries to probe with `which` during scans (e.g. gh, kubectl).
# Add more tools manually in this YAML or in ~/.config/zab/config.yaml under cli_watchlist.

ide:
  cursor_config: ~/.cursor/mcp.json
  claude_desktop_config: ~/Library/Application Support/Claude/claude_desktop_config.json
  codexbar:
    note: "Link or path to Codexbar when you have an integration spec."
    url: ""

cli_watchlist:
  - gh

proxies:
  litellm:
    base_url: "https://litellm.example.com"
    api_key_env: "OPENAI_API_KEY"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
